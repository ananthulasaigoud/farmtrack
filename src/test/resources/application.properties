# Test configuration: in-memory H2 database, so tests never touch the real MySQL data.
spring.application.name=farmtrack-test
spring.datasource.url=jdbc:h2:mem:farmtrack_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false


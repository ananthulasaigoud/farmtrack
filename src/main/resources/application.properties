
spring.application.name=farmtrack

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmtrack_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Password Reset
app.auth.reset-token-minutes=15
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}

# Guest Account
app.guest.enabled=true
app.guest.phone=9999999999
app.guest.password=${GUEST_PASSWORD}
app.guest.reset-on-startup=false

# Admin
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# =====================================================================
# FarmTrack settings - SHARED file (safe to push to GitHub: no secrets here)
#
# Secrets come from environment variables:
#   - On Railway / any server: set them in the Environment / Variables tab.
#   - On your laptop: they are in application-local.properties (git-ignored),
#     which is loaded automatically because the "local" profile is the default.
# =====================================================================

spring.application.name=farmtrack

# "local" by default -> also loads application-local.properties if that file exists.
# On the server that file does not exist (it is never pushed), so only environment variables are used.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server (Railway gives the port in PORT)
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmtrack_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT - secret must be a Base64 value of at least 32 bytes. Required.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Password reset
app.auth.reset-token-minutes=15
# true only for development (shows the reset token on screen because no SMS/email is connected)
app.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}

# Guest account (shown on the login page, so the password is not a secret).
# guest123 must match GUEST_PASSWORD in static/js/login.js
app.guest.enabled=${GUEST_ENABLED:true}
app.guest.phone=9999999999
app.guest.password=${GUEST_PASSWORD:guest123}
app.guest.reset-on-startup=${GUEST_RESET_ON_STARTUP:false}

# Admin (optional; created at startup only when both are set)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

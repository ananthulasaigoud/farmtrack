<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses - FarmTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="brand">🌱 FarmTrack</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="crops.html">Crops</a>
      <a href="expenses.html">Expenses</a>
      <a href="income.html">Income</a>
      <a href="reports.html">Reports</a>
      <a href="profile.html">Profile</a>
    </nav>
    <div class="user-box">
      <span id="userName"></span>
      <button id="logoutBtn" class="btn btn-light btn-small">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <div>
        <h1>Expenses</h1>
        <p class="subtitle">Seeds, fertilizer, labour, pesticides, irrigation and more</p>
      </div>
      <button id="addExpenseBtn" class="btn">+ Add expense</button>
    </div>

    <div id="message" class="message" hidden></div>

    <!-- Add / edit form -->
    <div class="card" id="formCard" hidden>
      <h2 id="formTitle">Add expense</h2>
      <div id="formMessage" class="message" hidden></div>

      <form id="expenseForm">
        <div class="form-grid">
          <div>
            <label for="cropId">Crop *</label>
            <select id="cropId" required></select>
          </div>
          <div>
            <label for="category">Category *</label>
            <select id="category">
              <option value="SEEDS">Seeds</option>
              <option value="FERTILIZER">Fertilizer</option>
              <option value="LABOUR">Labour</option>
              <option value="PESTICIDE">Pesticides</option>
              <option value="IRRIGATION">Irrigation</option>
              <option value="MACHINERY">Machinery</option>
              <option value="TRANSPORT">Transport</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
          <div>
            <label for="amount">Amount (₹) *</label>
            <input id="amount" type="number" min="0.01" step="0.01" required>
          </div>
          <div>
            <label for="expenseDate">Date *</label>
            <input id="expenseDate" type="date" required>
          </div>
          <div class="full">
            <label for="description">Description</label>
            <input id="description" maxlength="500" placeholder="e.g. 2 bags of urea">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Save expense</button>
          <button type="button" class="btn btn-light" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>

    <!-- History -->
    <div class="card">
      <div class="card-header">
        <h2>Expense history · <span class="loss" id="total">₹0.00</span></h2>
        <div class="filters">
          <select id="categoryFilter">
            <option value="">All categories</option>
            <option value="SEEDS">Seeds</option>
            <option value="FERTILIZER">Fertilizer</option>
            <option value="LABOUR">Labour</option>
            <option value="PESTICIDE">Pesticides</option>
            <option value="IRRIGATION">Irrigation</option>
            <option value="MACHINERY">Machinery</option>
            <option value="TRANSPORT">Transport</option>
            <option value="OTHER">Other</option>
          </select>
          <select id="cropFilter"></select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Date</th><th>Crop</th><th>Category</th><th>Description</th><th class="right">Amount</th><th></th></tr>
          </thead>
          <tbody id="expenseTable">
            <tr><td colspan="6" class="empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>

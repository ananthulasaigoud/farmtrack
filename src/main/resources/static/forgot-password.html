<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - FarmTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-box">
      <span class="brand">🌱 FarmTrack</span>

      <div class="card">
        <h1>Reset password</h1>
        <div id="message" class="message" hidden></div>

        <!-- Step 1: ask for phone/email -->
        <form id="requestForm">
          <p class="subtitle">Enter the phone number or email you registered with</p>
          <div class="field">
            <label for="identifier">Phone number or email</label>
            <input id="identifier" required>
          </div>
          <button type="submit" class="btn">Get reset token</button>
        </form>

        <!-- Step 2: token + new password (shown after step 1) -->
        <form id="resetForm" hidden>
          <div class="field">
            <label for="token">Reset token</label>
            <input id="token" required>
          </div>
          <div class="field">
            <label for="newPassword">New password (min 6 characters)</label>
            <input id="newPassword" type="password" required minlength="6">
          </div>
          <button type="submit" class="btn">Update password</button>
        </form>
      </div>

      <div class="auth-links">
        <a href="index.html">Back to login</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>

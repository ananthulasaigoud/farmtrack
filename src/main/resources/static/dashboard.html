<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - FarmTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="brand">🌱 FarmTrack</a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="crops.html">Crops</a>
      <a href="expenses.html">Expenses</a>
      <a href="income.html">Income</a>
      <a href="reports.html">Reports</a>
      <a href="profile.html">Profile</a>
    </nav>
    <div class="user-box">
      <span id="userName"></span>
      <button id="logoutBtn" class="btn btn-light btn-small">Logout</button>
    </div>
  </header>

  <main class="container">
    <h1>Dashboard</h1>
    <p class="subtitle">How your farm is doing</p>

    <div id="message" class="message" hidden></div>

    <!-- Summary numbers -->
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total crops</div>
        <div class="stat-value" id="totalCrops">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total expenses</div>
        <div class="stat-value loss" id="totalExpenses">-</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total income</div>
        <div class="stat-value" id="totalIncome">-</div>
      </div>
      <div class="stat">
        <div class="stat-label" id="profitLabel">Total profit</div>
        <div class="stat-value" id="profit">-</div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Income vs expense chart -->
      <div class="card">
        <div class="card-header">
          <h2>Income vs expenses</h2>
          <select id="year"></select>
        </div>
        <div class="bar-chart" id="monthlyChart"></div>
        <div class="legend">
          <span class="income">Income</span>
          <span class="expense">Expenses</span>
        </div>
      </div>

      <!-- Expenses by category -->
      <div class="card">
        <h2>Where the money went</h2>
        <div id="categoryBars"></div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Crop-wise profit -->
      <div class="card">
        <h2>Profit by crop</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Crop</th>
                <th class="right">Expenses</th>
                <th class="right">Income</th>
                <th class="right">Profit / loss</th>
              </tr>
            </thead>
            <tbody id="cropTable"></tbody>
          </table>
        </div>
      </div>

      <!-- Best crop -->
      <div class="card best-crop">
        <h2>Best-performing crop</h2>
        <div id="bestCrop"></div>
      </div>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
